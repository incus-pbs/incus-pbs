name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # keyless cosign signature and build provenance
      attestations: write  # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: build/goreleaser/SHA256SUMS
      # Hand the .deb files to publish-apt, which runs without contents: write.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debs
          path: build/goreleaser/*.deb
          if-no-files-found: error
          retention-days: 7

  # Push the .deb files to the Cloudsmith apt repo. Stable tags only: a tag
  # with a hyphen (v1.2.3-rc.1) is a prerelease, as in GoReleaser's
  # prerelease: auto. Authenticates with GitHub OIDC, so no API key is stored.
  publish-apt:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # OIDC token exchanged for a short-lived Cloudsmith token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debs
          path: debs
      - uses: cloudsmith-io/cloudsmith-cli-action@43ad6309c0e532af72d816fb256fa2f3161f765a # v3.3.1
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
          oidc-service-slug: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
      # The binary is static (CGO_ENABLED=0), so one any-distro/any-version
      # upload serves every Debian and Ubuntu release.
      - name: Push to Cloudsmith
        env:
          NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
        run: |
          for f in debs/*.deb; do
            cloudsmith push deb "$NAMESPACE/incus-pbs/any-distro/any-version" "$f"
          done
